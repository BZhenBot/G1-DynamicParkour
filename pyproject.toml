[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-dynamicparkour"
version = "2.2.0rc1"
description = "Evidence-driven G1 dynamic-platform parkour in MuJoCo Warp"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{name = "G1-DynamicParkour contributors"}]
dependencies = ["mjlab==1.6.0", "torch==2.7.1", "mujoco==3.11.0", "mujoco-warp==3.11.0", "warp-lang==1.14.0", "rsl-rl-lib==5.4.2", "numpy==2.2.6", "tensordict==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]
